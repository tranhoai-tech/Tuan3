<p>Trang kiểm tra cục bộ (thay cho trang JavaScriptTest.php của tác giả). Bật JavaScript rồi tải lại trang, sau đó tắt
JavaScript (Chrome: F12 &rarr; Ctrl+Shift+P &rarr; gõ <code>Disable JavaScript</code>) và tải lại để so sánh.</p>

<h2 id="js-status"><noscript>You have JavaScript disabled</noscript></h2>

<script>
  // Dòng này chỉ chạy khi JavaScript đang được bật
  document.getElementById("js-status").innerHTML = "You have JavaScript enabled";
</script>
