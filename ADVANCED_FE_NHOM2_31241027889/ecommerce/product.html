  <!-- xZoom (zoom + chọn ảnh) -->

      </button>
      <a class="navbar-brand" href="index.html"><img src="images/logo.svg" alt="Logo" class="homepage-header-logo" height="30"></a>

      <ul class="nav navbar-nav">
        <li ><a href="index.html">Trang chủ</a></li>

          </ul>

      <form class="navbar-form navbar-left hidden-xs search-form">

      </form>

        <li><a href="#"><span class="badge pull-right" id="cart-count">0</span><i class="glyphicon glyphicon-shopping-cart"></i></a></li>

    <div class="col-sm-4 col-md-3">
      <h3 class="sidebar-title">Danh mục</h3>

<div class="modal fade" id="myModal" tabindex="-1" role="dialog"><div class="modal-dialog modal-sm"><div class="modal-content">
  <div class="modal-header"><button type="button" class="close" data-dismiss="modal">&times;</button><h4 class="modal-title">Đăng nhập</h4></div>
  <div class="modal-body"><form onsubmit="return false"><div class="form-group"><input class="form-control" placeholder="Email"></div>
  <div class="form-group"><input type="password" class="form-control" placeholder="Mật khẩu"></div><button class="btn btn-success btn-block">Đăng nhập</button></form></div>
</div></div></div>
<div class="modal fade" id="reviewModal" tabindex="-1" role="dialog"><div class="modal-dialog"><div class="modal-content">
  <form id="review-form">
  <div class="modal-header"><button type="button" class="close" data-dismiss="modal">&times;</button><h4 class="modal-title">Viết đánh giá</h4></div>
  <div class="modal-body">
    <div class="form-group"><label>Họ tên</label><input id="review-name" class="form-control" placeholder="Tên của bạn"></div>
    <div class="form-group"><label>Chấm điểm</label><input id="review-rating" type="number" class="rating-loading" value="5"></div>
    <div class="form-group"><label>Nhận xét</label><textarea id="review-text" class="form-control" rows="3" required></textarea></div>
  </div>
  <div class="modal-footer"><button type="submit" class="btn btn-success">Gửi đánh giá</button></div>
  </form></div></div></div>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
