<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile – Trần Thị Hoài</title>
  <style>
    :root {
      --ink: #182033;
      --muted: #697089;
      --pink: #ec7897;
      --pink-dark: #d95f82;
      --cream: #fff7f4;
      --line: #f1dde2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 18%, rgba(236, 120, 151, .18), transparent 25%),
        radial-gradient(circle at 88% 82%, rgba(255, 195, 166, .24), transparent 28%),
        linear-gradient(135deg, #fffaf8, #f8eef5);
    }
    .profile-card {
      position: relative;
      width: min(920px, 100%);
      min-height: 520px;
      display: grid;
      grid-template-columns: 42% 58%;
      overflow: hidden;
      background: rgba(255, 255, 255, .94);
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 32px;
      box-shadow: 0 24px 70px rgba(82, 55, 72, .16);
    }
    .photo-panel {
      position: relative;
      display: grid;
      place-items: center;
      padding: 40px;
      background: linear-gradient(145deg, #f6bac8, #f8ddd1);
    }
    .photo-panel::before,
    .photo-panel::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 50%;
    }
    .photo-panel::before { width: 260px; height: 260px; }
    .photo-panel::after { width: 340px; height: 340px; }
    .avatar {
      position: relative;
      z-index: 1;
      width: 230px;
      height: 230px;
      display: grid;
      place-items: center;
      border: 8px solid rgba(255,255,255,.82);
      border-radius: 50%;
      color: white;
      font-family: Georgia, serif;
      font-size: 82px;
      background: linear-gradient(145deg, #dd8da4, #c86d87);
      box-shadow: 0 18px 38px rgba(143, 75, 101, .25);
    }
    .info-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 52px 54px;
    }
    .eyebrow {
      margin: 0 0 12px;
      color: var(--pink-dark);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 24px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 6vw, 58px);
      line-height: 1.05;
    }
    .details { display: grid; gap: 12px; }
    .detail {
      display: grid;
      grid-template-columns: 108px 1fr;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid var(--line);
      font-size: 16px;
    }
    .detail strong { color: var(--muted); font-size: 13px; letter-spacing: .4px; }
    .detail span { font-weight: 700; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
    .button {
      min-width: 155px;
      padding: 14px 20px;
      border: 2px solid var(--pink);
      border-radius: 999px;
      text-align: center;
      text-decoration: none;
      font-weight: 800;
      transition: .25s ease;
    }
    .button.primary { color: white; background: var(--pink); box-shadow: 0 10px 24px rgba(236,120,151,.25); }
    .button.secondary { color: var(--pink-dark); background: white; }
    .button:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(236,120,151,.24); }
    @media (max-width: 720px) {
      body { padding: 14px; align-items: start; }
      .profile-card { grid-template-columns: 1fr; }
      .photo-panel { min-height: 280px; }
      .photo-panel::before { width: 220px; height: 220px; }
      .photo-panel::after { width: 270px; height: 270px; }
      .avatar { width: 190px; height: 190px; font-size: 68px; }
      .info-panel { padding: 36px 26px 40px; }
      .detail { grid-template-columns: 88px 1fr; }
      .button { flex: 1; }
    }
  </style>
</head>
<body>
  <main class="profile-card">
    <section class="photo-panel" aria-label="Ảnh đại diện">
      <div class="avatar" aria-label="Chữ cái đầu tên">HT</div>
    </section>
    <section class="info-panel">
      <p class="eyebrow">Student Profile</p>
      <h1>Trần Thị Hoài</h1>
      <div class="details">
        <div class="detail"><strong>MSSV</strong><span>31241027889</span></div>
        <div class="detail"><strong>Lớp</strong><span>EE0001</span></div>
        <div class="detail"><strong>Trường</strong><span>UEH</span></div>
        <div class="detail"><strong>Môn học</strong><span>Phát triển ứng dụng TMĐT</span></div>
      </div>
      <nav class="actions" aria-label="Các bài tập">
        <a class="button primary" href="ecommerce/index.html">Bài 1</a>
        <a class="button secondary" href="flappy-bird/index.html">Bài 3</a>
      </nav>
    </section>
  </main>
</body>
</html>
