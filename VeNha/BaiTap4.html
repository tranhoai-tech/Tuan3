<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Bài tập 4 - Menu ngang</title>
  <style>
    ul {
      list-style: none;          /* bỏ dấu chấm đầu dòng */
      margin: 0;
      padding: 0;
    }
    li {
      display: inline-block;     /* các li nằm trên 1 hàng nhưng vẫn đặt được width/height */
      width: 110px;
      margin-right: 5px;
      background-color: aqua;
      text-align: center;
      font-size: 22px;
      font-family: "Times New Roman", serif;
    }
    li a {
      display: block;            /* link phủ kín li */
      padding: 2px 0;
    }
  </style>
</head>
<body>
  <ul>
    <li><a href="#">TMDT</a></li>
    <li><a href="#">ERP</a></li>
    <li><a href="#">MIS</a></li>
    <li><a href="#">DS</a></li>
  </ul>
</body>
</html>
