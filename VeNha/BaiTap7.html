<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Bài tập 7 - Bố cục trang</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 18px;
      margin: 20px;
    }
    #wrapper {
      width: 400px;
      padding: 8px;
      border: 3px solid #000;
      box-shadow: 12px 12px 14px #888;
      overflow: hidden;            /* chứa các phần tử float bên trong */
    }
    header, nav, main, footer {
      border: 2px solid #000;
      padding: 4px 8px;
      box-sizing: border-box;
    }
    header {
      height: 50px;
      margin-bottom: 8px;
    }
    nav {
      float: left;                 /* cột trái */
      width: 15%;
      height: 220px;
    }
    main {
      float: right;                /* cột phải */
      width: 83%;
      height: 220px;
    }
    footer {
      clear: both;                 /* nằm dưới cùng, không bị float đè */
      height: 36px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <header>header</header>
    <nav>nav</nav>
    <main>main</main>
    <footer>footer</footer>
  </div>
</body>
</html>
