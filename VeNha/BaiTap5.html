<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Khoa CNTTKD</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
    }
    .best-shared {
      text-align: center;           /* canh giữa toàn bộ nội dung */
      padding: 30px 20px;
    }
    .best-shared h2 {
      font-size: 44px;
      font-weight: normal;
      color: #333;
      margin: 20px 0;
    }
    .best-shared h2 strong {
      color: #00a8e8;               /* chữ xanh dương */
      font-weight: bold;
    }
    .lead-text {
      font-size: 14px;
      color: #333;
      margin-bottom: 30px;
    }
    .btn-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .btn-list li {
      display: inline-block;        /* 2 nút nằm trên cùng 1 hàng */
      margin: 0 10px;
    }
    .btn-list a {
      display: inline-block;
      width: 140px;
      padding: 14px 0;
      background-color: #2b2f33;
      color: #fff;
      font-size: 13px;
      text-decoration: none;        /* bỏ gạch chân */
      border-radius: 3px;
    }
    .btn-list a:hover {
      background-color: #00a8e8;
    }
  </style>
</head>
<body>
  <section class="best-shared">
    <p class="logo"><img style="width:200px" src="https://bit.ueh.edu.vn/wp-content/uploads/2017/06/BIT_logo.png" alt=""></p>
    <h2>Best <strong>Shared Hosting</strong> Company</h2>
    <p class="lead-text">With this responsive landing page template, you can promote your all hosting, domain and email services.</p>
    <ul class="btn-list">
      <li><a href="./">View Plans</a></li>
      <li><a href="./">All Features</a></li>
    </ul>
  </section>
</body>
</html>
